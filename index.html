<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Formulario Encuesta</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styles/styles.css">
    </head>
    <body>

        <h1>Personajes del MCU</h1>

        <form action="index.html">

            <Label for="Millonario">Tu personaje es Millonario</Label><br>
            <input type="radio" name="Millonario" id="Millonario" value="Si" required>
            <label for="Millonario">Si</label><br>
            <input type="radio" name="Millonario" id="Millonario" value="No" required>
            <label for="Millonario">No</label><br>



            <Label for="muere">Tu personaje muere al final EndGame</Label><br>
            <input type="radio" name="muere" id="muere" value="Si" required>
            <label for="muere">Si</label><br>
            <input type="radio" name="muere" id="muere" value="No" required>
            <label for="muere">No</label><br>



            <Label for="Cualidades">Seleciona las Cualidades de tu personaje</Label><br>
            <input type="checkbox" name="Cualidades" id="Cualidades" required>
            <label for="Cualidades">Analista</label><br>
            <input type="checkbox" name="Cualidades" id="Cualidades" required>
            <label for="Cualidades">Diplomatico</label><br>
            <input type="checkbox" name="Cualidades" id="Cualidades" required>
            <label for="Cualidades">Tonto</label><br>
            <input type="checkbox" name="Cualidades" id="Cualidades" required>
            <label for="Cualidades">Amable</label><br>
            <input type="checkbox" name="Cualidades" id="Cualidades" required>
            <label for="Cualidades">Honesto</label><br>
            <input type="checkbox" name="Cualidades" id="Cualidades" required>
            <label for="Cualidades">Perceverante</label><br>
            <input type="checkbox" name="Cualidades" id="Cualidades" required>
            <label for="Cualidades">Resposable</label><br>
            <input type="checkbox" name="Cualidades" id="Cualidades" required>
            <label for="Cualidades">Creativo</label><br>



            <p>Que te parecio la Encuesta deja un comentario</p>
            <br><label for="comentario">comentario</label>
            <input type="text"><br>

            <br><input type="submit" value="Enviar"><br>

        </form>   

    </body>
</html>
